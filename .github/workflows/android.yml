
name: Build MD Promo to Video Maker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        run: npm install

      - name: Create Android Project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install Native Exporter
        run: |
          mkdir -p android/app/src/main/java/com/md/promotovideomaker
          cp native/NativeVideoExporterPlugin.java android/app/src/main/java/com/md/promotovideomaker/
          cp native/MainActivity.java android/app/src/main/java/com/md/promotovideomaker/

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-Promo-Video-Maker-Phase2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
